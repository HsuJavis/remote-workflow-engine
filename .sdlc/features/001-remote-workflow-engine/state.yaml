  execution: two GatewayClient implementations — LiteLLMGatewayClient (src/gateway/client.ts,
  default-on managed `litellm[proxy]` Python subprocess routing as of D-R1; config opt-out via
  useLiteLLMProxy:false falls back to direct per-provider fetch) and ClaudeAgentSdkGatewayClient
  (src/gateway/claude-agent-sdk-client.ts, D-F1) backed by the genuine @anthropic-ai/claude-agent-sdk
  query() API (ANTHROPIC_BASE_URL -> the same managed LiteLLM proxy + dummy ANTHROPIC_API_KEY,
  injectable queryImpl) — as of D-F4, src/main.ts (the real product entrypoint) constructs this as
