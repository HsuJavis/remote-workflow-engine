m-prompt body was stripped out of persisted transcripts by stripFirstSegment, which v34 removed along with agentType itself — descriptor.prompt (and therefore run_agent_log's harness.prompt) is now the verbatim dispatched string with no separate systemPrompt slot, so the inlined role text travels in every registered version of the script and is visible to anyone who can read that run's agent log (same-principal callers, or an admin with cross-read authority), capped at 4KB head+tail only for very long prompts in the persisted copy. This is a real visibility regression relative to the old mechanism, not a cosmetic one."
