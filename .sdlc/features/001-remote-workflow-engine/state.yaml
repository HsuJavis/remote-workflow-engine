e script (state machine correct) but the real spawned claude CLI subprocess is never killed: real repro suspended a slow 500-word-essay generation at t=2s, ps aux showed the same subprocess PID still alive/consuming CPU at t=4s, and it disappeared around t=12-14s — matching an unsuspended control run's own natural completion time of 15.92s, not an immediate cancellation; this is the same resource/cost-hygiene defect class round 3 found on the direct-fetch path (still unfixed there too, confirmed unchanged by code review), now also proven present on the officially-fixed SDK-default path for a different root cause; (3) main.ts never reads/forwards agentDefinitionsDir into ServerConfig at all (FileConfig's type inherits the field but main.ts's literal config object omits it) — so D-F2's real, tested agentType composition-root loader is permanently unreachable via the documented entrypoint; real repro: agent(prompt,{agentType:'researcher'}) against a real booted server always returns 'Unknown agentType: researcher' regardless of any agents/*.md directory, confirming REQ-003's 2nd acceptance clause's known-type-resolution half cannot be demonstrated today. All 3 are new findings, distinct from the already-route-backed D-F6/D-F7/D-F8/D-F9a/D-F9b class-level bugs (all individually correct now) and from round 3's carried-forward direct-fetch-path gaps. REQ-001/002/005/013/014 re-confirmed green with fresh repros this round (incl. a genuine 2-level-nesting rejection test distinct from round 3's 1-level test, and a second real restart proving all 6 workflows registered pre-restart survived with unchanged createdAt). Full suite: 54 files/190 tests, 189 pass/1 fail (same pre-existing environment-specific IT-015, unrelated). tsc --noEmit clean. trace --check: 18 gaps, unchanged pre-existing v2/v3-OOS baseline (REQ-008..012/015, TASK-018..023), 0 未真實驗證/未驗證 among v1 REQs (all v1 REQs have real:true VAL evidence, red or green). Config-file sync: rwe.config.example.json's existing keys confirmed still correct; NEW gap found (agentDefinitionsDir undocumented, tied to finding 3 above) — deliberately NOT added to the template since the underlying main.ts code gap makes the key inert regardless; documented as a known limitation instead. README.md/DEPLOY.md updated (繁體中文): round-4 header, revised known-limitations (3 confirmed-fixed, 3 new composition-root gaps with real evidence, 2 unchanged-since-round-2/3), troubleshooting table rows for the 2 new dead-on-arrival config knobs + the still-not-really-cancelled suspend behavior, README usage example 2 annotated. NOT marked passed:true — REQ-003 (agentType), REQ-004 (bounded timeout), REQ-006 (in-flight cancellation) all still have real, confirmed defects violating specific REQ acceptance clauses on the MANDATED default gateway path; a further Gate 5/6 route-back is needed, this time specifically targeting src/main.ts's composition-root wiring (not the classes it constructs, which are already correct) plus the still-open direct-fetch-path suspend-cancel gap and the litellm-orphan-process cleanup. Superseded note (round 3, preserved for history): 2026-07-03 14:30 Gate 7.5 ROUND 3 (post D-F5 route-back — opts.model forwarding + is_error handling in src/gateway/claude-agent-sdk-client.ts): real-run re-executed against 6 separate genuinely independent OS server processes (`npm run start` / `npx tsx src/main.ts`, confirmed via `ss -tlnp`/`ps -p`, reached by `curl` from a separate shell), a real local Ollama (qwen2.5:7b), a real managed `litellm[proxy]` Python 3.12 subprocess (D-R3, `uv venv`), and — for the SDK-default path — a real `@anthropic-ai/claude-agent-sdk` session spawning the real bundled `claude` CLI as an independent OS subprocess. BOTH round-2 SDK-gateway defects CONFIRMED FIXED: (1) opts.model/alias forwarding — `ps aux` shows the spawned CLI subprocess with `--model local`, the caller's own alias, genuinely forwarded (previously always the CLI's hard-coded default); a raw curl to the same 