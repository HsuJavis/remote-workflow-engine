ts/mcp-facade.ts) were NOT in scope for this round's binding decisions (D-F5 only touched claude-agent-sdk-client.ts) — re-confirmed still present, unchanged, via fresh real repros on independent processes this round (same root causes/line numbers as round 2). VAL-001/005/013/014/015 real:true+green (re-confirmed with fresh repros this round); VAL-002/003/004/006/007 real:true+red (result:fail) — VAL-003/VAL-004 evidence rewritten this round to show the 2 D-F5 fixes confirmed + the 2 new findings; VAL-002/006/007 annotated 'round-3: re-confirmed unchanged'. trace --check: 18 gaps, unchanged pre-existing v2/v3 OOS baseline, 0 未真實驗證/未驗證 among v1 items. Config-file sync: no new config-schema change needed this round (rwe.config.example.json's `\"gateway\":\"sdk\"` template default, set by D-F5/IMPL-039, verified still present and correct — the 2 new findings are code gaps, not config gaps; `\"direct-fetch\"` remains the fully-working documented opt-out). README.md/DEPLOY.md updated (繁體中文): round-3 header, 2 new known-limitations entries (5/6), 1 new troubleshooting row, README usage example 2 annotated with the thinking-gateway caveat, confirmed-fixed section updated to state both D-F5 fixes are re-verified. NOT marked passed: true — REQ-002 (budget script-visibility), REQ-003/REQ-004 (2 new SDK-default findings), REQ-006 (suspend cancellation), REQ-007 (restart transcript loss) all still have real, unresolved defects violating specific REQ acceptance clauses; a further Gate 5/6 route-back is needed for full v1 sign-off. The documented `gateway:\"direct-fetch\"` config workaround remains fully real-verified and usable today for REQ-003/004." }
