tech_stack: >-
  Node.js 22.6+ (real requirement, corrected at Gate 7.5 round 1 — native --experimental-transform-types;
  the "20+" above is historical/inaccurate, kept for traceability) / TypeScript (strict, ESM); tests
  with vitest; SQLite via better-sqlite3 (both RunStore and, as of the D-V2 route-back, WorkflowCatalog
  registrations); MCP server: hand-rolled JSON-RPC-over-HTTP (src/server.ts), NOT @modelcontextprotocol/sdk
  (drift from the original Gate 2/3 sketch, functionally equivalent, noted since round 1); agent
  execution: two GatewayClient implementations — LiteLLMGatewayClient (src/gateway/client.ts,
  default-on managed `litellm[proxy]` Python subprocess routing as of D-R1; config opt-out via
  useLiteLLMProxy:false falls back to direct per-provider fetch) and ClaudeAgentSdkGatewayClient
  (src/gateway/claude-agent-sdk-client.ts, D-F1) backed by the genuine @anthropic-ai/claude-agent-sdk
  query() API (ANTHROPIC_BASE_URL -> the same managed LiteLLM proxy + dummy ANTHROPIC_API_KEY,
  injectable queryImpl) — as of D-F4, src/main.ts (the real product entrypoint) constructs this as
  the DEFAULT gateway with a config opt-out (`"gateway":"sdk"|"direct-fetch"` in rwe.config.json,
  default "sdk"). Gate 7.5 round 2's 2 confirmed real defects on this default path (opts.model never
  forwarded; a real API error misreported as success) were FIXED by the D-F5 route-back and
  RE-VERIFIED FOR REAL at Gate 7.5 round 3 (`ps aux` shows the spawned CLI subprocess's own
  `--model <alias>` flag; a real Ollama/LiteLLM error now resolves to `null`, never smuggled as fake
  success text). NEW at Gate 7.5 round 3: this SAME default path has 2 different new confirmed real
  defects, only reachable now that the 2 old ones are fixed — (a) the SDK session unconditionally
  requests "extended thinking", which LiteLLM forwards to Ollama as `think:true`, rejected by
  non-reasoning Ollama models (e.g. qwen2.5:7b) with a 400, so every real SDK-default+local-Ollama
  agent() call fails after ~4 minutes of the CLI's own retry/backoff before safely resolving to
  `null` (confirmed-working fix isolated but not shipped: `options.thinking={type:'disabled'}`); (b)
  the gateway has no `timeoutMs`/`retries`-bounded race of its own (unlike the direct-fetch path), so
  the configured bound has no effect on this path — see gates.validation.note and 08-validation.md.
  The documented "direct-fetch" opt-out remains fully real-verified across all 3 rounds and is what
  rwe.config.example.json's own committed template still needs to fall back to for a working local-
  Ollama deployment today, even though its own `"gateway"` value stays "sdk" per the binding D-F5/D1
  product decision. Both GatewayClient paths need a real `litellm` binary on PATH (D-R3: requires
  Python 3.11/3.12 specifically — this sandbox's system Python 3.14 lacks prebuilt uvloop/orjson/
  websockets wheels; `uv python install 3.12` + a pinned venv works, see DEPLOY.md §1). agentType
  resolution: composition-root loader (D-F2, src/agent-definitions.ts) populates the agentTypes
  registry from agents/*.md frontmatter (name/model/prompt) at createServer() startup via
  ServerConfig.agentDefinitionsDir — confirmed real at Gate 7.5 round 2, code untouched since. schema
  validation = ajv (D-V4 real JSON-Schema retry-on-mismatch) — confirmed real at Gate 7.5 round 2,
  re-confirmed round 3 (schema-validated agent() success against real Ollama via direct-fetch).
  sandbox = node:child_process + node:vm restricted context (round-2 finding, unchanged/re-confirmed
  round 3: the script-visible budget.spent()/remaining() accessors in src/sandbox/child-entry.ts are
  hard-coded stubs, never reflect live usage — server-side enforcement via RunGuard is correct).
  Ollama used as the real local-model provider throughout all 3 Gate 7.5 rounds. Package manager: npm.

