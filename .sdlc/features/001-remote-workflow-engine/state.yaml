  - "Operational hazard, not REQ-blocking (first found Gate 7.5 round 5, RE-CONFIRMED STILL OPEN round 6, reproduced live twice this round): LiteLLMProxyManager hard-codes port 4000 (not derived from ServerConfig/FileConfig). Combined with the pre-existing known orphan-litellm-on-shutdown limitation, a second server instance started while an orphan from a prior instance still holds port 4000 gets a false-positive healthy boot against the STALE orphan instead of its own freshly-generated proxy (round-6 repro: ss -tlnp confirmed port 4000 held by the FIRST instance's orphan the entire time a 2nd/3rd instance, each with a different alias config, reported '[remote-workflow-engine] ready'). Documented as a pre-launch-cleanup step in DEPLOY.md §1/§2/§4/§5 and in 08-validation.md's v1.1 backlog (suggested fix: derive the port or pick one dynamically)."
  - "Minor operational cleanup (not REQ-blocking, documented as known limitations in DEPLOY.md, unchanged since round 2, re-confirmed still open round 6): main.ts's SIGTERM/SIGINT shutdown never stops the managed LiteLLMProxyManager subprocess (orphaned litellm process after every graceful restart, re-confirmed this round across all 5 server instances); LiteLLMProxyManager.start()'s mkdtemp() temp config dirs are never cleaned up (cosmetic /tmp accumulation). Both filed to 08-validation.md's v1.1 backlog."
  - "User decision still open (carried from round 1, D-V3 already accepts Ollama-only v1 real coverage, not re-raised as a new ask): no ANTHROPIC_API_KEY/OPENAI_API_KEY/GEMINI_API_KEY in this environment — REQ-004's paid-provider success path beyond the terminal/missing-credentials branch remains real-unverified. local Ollama + gateway:\"sdk\" (default) is fully real-verified for REQ-004 (all 4 clauses green). Whether paid providers' models correctly perform tool-use through this same SDK gateway is ALSO unverified (only Ollama's tool-use non-firing has been confirmed this round; a paid provider might behave differently) — this is the D-F11 model-capability-tier gap's own open question, not a new ask."
  - "tech_stack drift note (not blocking, for awareness, unchanged from round 1): the actual delivered architecture is a hand-rolled JSON-RPC-over-HTTP server (src/server.ts) with two GatewayClient implementations (direct-fetch/LiteLLM-proxy-fronted, and a real @anthropic-ai/claude-agent-sdk session) rather than the @modelcontextprotocol/sdk-based design originally sketched at Gate 2/3 — functionally meets the REQs. Real Node requirement is 22.6+ (native --experimental-transform-types), not the documented 20+. Real Python requirement is 3.11/3.12 for the litellm[proxy] subprocess dependency, not previously documented at all."
  - "Config-drift found and fixed at Gate 7.5 round 6: rwe.config.example.json already shipped defaultAllowedTools (from a prior round's D-F11 implementation) but DEPLOY.md §1b never documented this key — fixed in round 6's DEPLOY.md rewrite (JSON example + prose explanation of purpose/default/precedence added). No further action needed."
  - "v1.1 backlog (non-REQ improvement ideas, explicitly NOT gate blockers per the CONVERGENCE RULE — full detail in 08-validation.md's own 'v1.1 backlog' section): (1) give an aborted AgentRecord its own terminal-ish state instead of 'running' forever; (2) fix the litellm port-4000 collision hazard (derive port or pick dynamically) and/or stop the managed litellm subprocess on shutdown; (3) re-run VAL-003's tool-use clause against a larger/more capable local model or a paid provider with sandbox credentials; (4) once tool-use is resolved on some model, re-check the latent ClaudeAgentSdkGatewayClient cwd-not-per-run-workspace gap (currently masked); (5) clean up LiteLLMProxyManager's mkdtemp() temp config dirs."
