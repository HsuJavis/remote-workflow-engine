# docker-compose.yml — REQ-011 / DES-022 / TASK-023 deploy packaging.
#
# Default (`docker compose up`): the "server" service only — no LiteLLM/Python subprocess in the
# image (replaceability, D-V2e). This boots cleanly ONLY with a `rwe.config.json` whose `gateway`
# is `"direct-fetch"` (+ `useLiteLLMProxy:false`) or `"pi"` — see README/DEPLOY.md §1a. The engine's
# OWN default, `gateway:"sdk"`, calls `litellm` at boot regardless of provider and will crash-loop
# in this service with `spawn litellm ENOENT` (audit A10) — use the "litellm" profile below instead
# if your config keeps `gateway:"sdk"`.
#
# Confinement: this image ships neither `bwrap` nor `socat`, so the Bash sandbox is always
# UNCONFINED here. Every MCP call also arrives over the compose network bridge, i.e. as a
# non-loopback peer — combined, this container refuses every `run_start`/`run_resume` whose version
# was registered remotely or whose request itself looks remote (see README "已知限制"). Treat this
# compose file as a way to boot the engine for local/loopback use (or behind a reverse proxy that
# itself runs on the host), not as a confined remote-run target.
#
# `workRoot` must resolve OUTSIDE `/app` (the bind-mounted repo has a `.git`, which the boot-time
# workRoot guard refuses — `WORKROOT_INSIDE_PROJECT`). The named volume below gives both services an
# out-of-repo default; point `RWE_CONFIG_PATH`'s `workRoot` at `/data` to use it.
#
# `OLLAMA_BASE_URL`'s default (`127.0.0.1:11434`) means the CONTAINER's own loopback, not the host —
# an Ollama server running on the host needs `OLLAMA_BASE_URL=http://host.docker.internal:11434`
# (Linux hosts: also add `extra_hosts: ["host.docker.internal:host-gateway"]` to the service).
#
# Bind-mounts this repo into the official Node 22 image and runs the exact same `npm ci && npm run
# start` sequence documented in README.md/DEPLOY.md §2 — no separate container-only startup logic
# to maintain.
#
# Optional "litellm" profile (`docker compose --profile litellm up server-litellm`): same image,
# but installs a pinned Python 3.11 venv + `litellm[proxy]` on PATH before boot, so the managed
# LiteLLM proxy subprocess (src/gateway/litellm-proxy.ts, spawn('litellm', ...)) has a real
# `litellm` binary to find. Needed only if rwe.config.json keeps the default `gateway:"sdk"`
# (D-R3: many hosts' system Python lacks prebuilt wheels for litellm's own dependencies, so this
# is pinned/isolated rather than relying on whatever Python 3.x the base image ships).
#
# Identical steps on localhost and on a remote host — no localhost-only shortcut.
volumes:
  rwe-workroot:

services:
  server:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - rwe-workroot:/data
    ports:
      - "${RWE_PORT:-8787}:${RWE_PORT:-8787}"
    environment:
      RWE_BIND: "0.0.0.0"
      RWE_PORT: "${RWE_PORT:-8787}"
      RWE_CONFIG_PATH: "${RWE_CONFIG_PATH:-/app/rwe.config.json}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      RWE_SECRET_ANTHROPIC_API_KEY: "${RWE_SECRET_ANTHROPIC_API_KEY:-}"
      RWE_SECRET_OPENROUTER_API_KEY: "${RWE_SECRET_OPENROUTER_API_KEY:-}"
      RWE_SECRET_GITHUB_TOKEN: "${RWE_SECRET_GITHUB_TOKEN:-}"
    command: sh -c "npm ci && npm run start"
    restart: on-failure

  server-litellm:
    profiles: ["litellm"]
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - rwe-workroot:/data
    ports:
      - "${RWE_PORT:-8787}:${RWE_PORT:-8787}"
    environment:
      RWE_BIND: "0.0.0.0"
      RWE_PORT: "${RWE_PORT:-8787}"
      RWE_CONFIG_PATH: "${RWE_CONFIG_PATH:-/app/rwe.config.json}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      RWE_SECRET_ANTHROPIC_API_KEY: "${RWE_SECRET_ANTHROPIC_API_KEY:-}"
      RWE_SECRET_OPENROUTER_API_KEY: "${RWE_SECRET_OPENROUTER_API_KEY:-}"
      RWE_SECRET_GITHUB_TOKEN: "${RWE_SECRET_GITHUB_TOKEN:-}"
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends python3.11 python3.11-venv &&
             python3.11 -m venv /opt/litellm-venv &&
             /opt/litellm-venv/bin/pip install --no-cache-dir 'litellm[proxy]' &&
             export PATH=/opt/litellm-venv/bin:$$PATH &&
             npm ci &&
             npm run start"
    restart: on-failure
