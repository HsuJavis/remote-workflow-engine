<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="300"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // FIX (bug 1): head at index 0, body extends LEFT so moving 'right' does not self-collide.
        let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        let direction = 'right';
        let food = { x: 15, y: 15 };
        let score = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            snake.forEach(segment => ctx.fillRect(segment.x * 20, segment.y * 20, 20, 20));
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x * 20, food.y * 20, 20, 20);
            // FIX (bug 2): draw the score on-canvas, not only in the game-over alert.
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText('Score: ' + score, 8, 20);
        }

        function update() {
            const head = { x: snake[0].x, y: snake[0].y };
            switch (direction) {
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'right':
                    head.x++;
                    break;
            }
            if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 15) {
                alert('Game Over! Score: ' + score);
                return false;
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    alert('Game Over! Score: ' + score);
                    return false;
                }
            }

            let newSnake = [head, ...snake];
            if (head.x === food.x && head.y === food.y) {
                score++;
                do {
                    food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 15) };
                } while (newSnake.some(segment => segment.x === food.x && segment.y === food.y));
            } else {
                newSnake.pop();
            }

            snake = newSnake;
            return true;
        }

        // FIX (bug 3): stop the loop on game over so update() doesn't re-alert every 100ms.
        let gameOver = false;
        function gameLoop() {
            if (gameOver) return;
            if (!update()) { gameOver = true; draw(); return; }
            draw();
        }

        document.addEventListener('keydown', event => {
            const allowedDirections = {
                37: 'left',
                38: 'up',
                39: 'right',
                40: 'down'
            };

            if (allowedDirections[event.keyCode]) {
                direction = allowedDirections[event.keyCode];
            }
        });

        setInterval(gameLoop, 100);

        document.addEventListener('keydown', event => {
            if (event.code === 'Space' || event.key === 'R') {
                location.reload();
            }
        });
    </script>
</body>
</html>
