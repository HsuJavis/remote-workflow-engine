# Drop-in for the INSTALLED unit (~/.config/systemd/user/rwe.service.d/override.conf) — never
# edit deploy/rwe.user.service itself for a host-specific value like the port. A drop-in's
# Environment= is appended after the main unit's; the LAST Environment=RWE_PORT= wins, so this
# overrides the base unit's RWE_PORT=8787 without touching the shipped template.
# 8899 is this project's own production value — edit to the port this deployment actually uses.
[Service]
Environment=RWE_PORT=8899
